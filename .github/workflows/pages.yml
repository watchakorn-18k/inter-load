name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'landingpage/**'
      - 'screens/**'
      - 'src-tauri/icons/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp landingpage/index.html _site/index.html
          cp -r screens _site/screens
          mkdir -p _site/src-tauri/icons
          cp src-tauri/icons/32x32.png _site/src-tauri/icons/
          cp src-tauri/icons/128x128.png _site/src-tauri/icons/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
