<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Inter-Load Logo</title>
  <desc>Standalone vector logo for Inter-Load: incoming payload flow, inspection window, and forwarding cue.</desc>

  <defs>
    <linearGradient id="tealGradient" x1="96" y1="512" x2="866" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B7C4"/>
      <stop offset="1" stop-color="#08D0C2"/>
    </linearGradient>
    <linearGradient id="navyGradient" x1="255" y1="254" x2="688" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#061E4D"/>
      <stop offset="1" stop-color="#082B63"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#061E4D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Intercept brackets -->
  <path d="M318 318H283C267 318 254 331 254 347V441" stroke="#061E4D" stroke-width="28" stroke-linecap="square"/>
  <path d="M254 583V677C254 693 267 706 283 706H318" stroke="#061E4D" stroke-width="28" stroke-linecap="square"/>
  <path d="M707 318H742C758 318 771 331 771 347V441" stroke="#061E4D" stroke-width="28" stroke-linecap="square"/>
  <path d="M771 583V677C771 693 758 706 742 706H707" stroke="#061E4D" stroke-width="28" stroke-linecap="square"/>

  <!-- App / payload inspector window -->
  <g filter="url(#softShadow)">
    <rect x="352" y="292" width="360" height="440" rx="38" fill="url(#navyGradient)"/>
    <rect x="383" y="374" width="298" height="316" rx="8" fill="#FFFFFF"/>
    <circle cx="408" cy="335" r="13" fill="#13C7C6"/>
    <circle cx="453" cy="335" r="13" fill="#13C7C6"/>
    <circle cx="498" cy="335" r="13" fill="#13C7C6"/>
  </g>

  <!-- Incoming data streams -->
  <path d="M86 441H146C170 441 174 477 208 477H362" stroke="url(#tealGradient)" stroke-width="23" stroke-linecap="round"/>
  <path d="M86 512H360" stroke="url(#tealGradient)" stroke-width="23" stroke-linecap="round"/>
  <path d="M86 583H146C170 583 174 547 208 547H362" stroke="url(#tealGradient)" stroke-width="23" stroke-linecap="round"/>

  <circle cx="70" cy="441" r="18" fill="#10B7C4"/>
  <circle cx="70" cy="512" r="18" fill="#061E4D"/>
  <circle cx="70" cy="583" r="18" fill="#10B7C4"/>

  <!-- Main intercept arrow -->
  <path d="M347 435L455 512L347 589V547H214C204 547 196 539 196 529V495C196 485 204 477 214 477H347V435Z" fill="url(#tealGradient)"/>

  <!-- Payload code marks -->
  <path d="M448 430C434 430 426 439 426 454V467C426 476 420 482 412 482C420 482 426 488 426 497V510C426 525 434 534 448 534" stroke="#10B7C4" stroke-width="18" stroke-linecap="round"/>
  <path d="M448 572C434 572 426 581 426 596V609C426 618 420 624 412 624C420 624 426 630 426 639V652C426 667 434 676 448 676" stroke="#10B7C4" stroke-width="18" stroke-linecap="round"/>

  <circle cx="494" cy="471" r="11" fill="#9AB1C4"/>
  <circle cx="494" cy="522" r="11" fill="#9AB1C4"/>
  <circle cx="494" cy="573" r="11" fill="#9AB1C4"/>
  <path d="M530 456H620" stroke="#9AB1C4" stroke-width="16" stroke-linecap="round"/>
  <path d="M530 507H598" stroke="#9AB1C4" stroke-width="16" stroke-linecap="round"/>
  <path d="M530 558H636" stroke="#9AB1C4" stroke-width="16" stroke-linecap="round"/>
  <path d="M530 623H606" stroke="#9AB1C4" stroke-width="16" stroke-linecap="round"/>

  <!-- Forward cue -->
  <circle cx="747" cy="512" r="14" fill="#10B7C4"/>
  <circle cx="787" cy="512" r="14" fill="#10B7C4"/>
  <circle cx="827" cy="512" r="14" fill="#10B7C4"/>
  <path d="M863 512H930" stroke="url(#tealGradient)" stroke-width="22" stroke-linecap="round"/>
  <path d="M906 471L947 512L906 553" stroke="url(#tealGradient)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
